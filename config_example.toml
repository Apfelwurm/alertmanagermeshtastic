log_level = "debug"

[general]
inputtimeshift = 2      # this time in hours will be added to the "in" time of the message that gets sent to the client
statustimeshift = 2     # this time in hours will be added to the "status" time of the message (startsAt/endsAt) that gets sent to the client

[http]
host = "127.0.0.1"
port = 9119
clearsecret = "your_secret_key"

[meshtastic.connection]
tty = "/tmp/vcom0"
# Single node (backward compatible):
nodeid = 631724152
# OR multiple nodes (new format):
# nodeids = [631724152, 123456789, 987654321]
maxsendingattempts = 30
timeout = 60

# Node failure handling (optional, defaults shown)
failure_threshold = 3    # Number of failures before node is temporarily skipped
base_backoff_time = 30   # Initial backoff time in seconds
max_backoff_time = 300   # Maximum backoff time in seconds (5 minutes)
backoff_multiplier = 2   # Exponential backoff multiplier
